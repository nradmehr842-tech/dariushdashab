<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>حکم آنلاین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#250706; --ink-2:rgba(64,12,10,.82); --ink-3:rgba(95,19,15,.68);
    --cream:#fff8e8; --cream-dim:#f2dfb8;
    --saffron:#f0c66e; --saffron-dim:#c9892d;
    --teal:#f0c66e; --teal-dim:#c9892d;
    --ember:#a92c27;
    --text-ink:#fffaf0; --text-ink-dim:#ead8b8; --text-cream:#2a0b07;
    --line:rgba(240,198,110,.34);
    --shadow:0 18px 44px rgba(18,2,1,.54);
    --game-label-size:clamp(18px,2.5vw,23px);
    --game-number-size:var(--game-label-size);
    --game-label-color:#f2c56c;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100vh;
    background:
      radial-gradient(circle at 50% 2%,rgba(235,177,82,.18),transparent 28%),
      radial-gradient(circle at 50% 48%,#711b15 0,#3b0b09 48%,#170403 100%);
    color:var(--text-ink); font-family:'Vazirmatn', Tahoma, sans-serif; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.16;
    background:radial-gradient(ellipse at 50% 20%, rgba(255,190,90,.28), transparent 45%);
    mix-blend-mode:screen;
  }
  #app{ position:relative; max-width:820px; margin:0 auto; min-height:100dvh; padding:8px 8px 86px; display:flex; flex-direction:column; }
  h1,h2,h3{ margin:0; }
  .eyebrow{ font-size:12px; letter-spacing:.06em; color:var(--text-ink-dim); font-weight:600; }
  button{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--saffron); outline-offset:2px; }

  .topbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; padding:7px 4px 12px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .mark{ font-size:20px; }
  .brand h1{ font-size:16px; font-weight:800; }
  .scorebar{ display:flex; gap:8px; align-items:center; }
  .score-chip{ display:flex; align-items:center; gap:6px; background:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-weight:800; font-size:14px; }
  .score-chip .score-name{ max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-ink-dim); font-size:10px; font-weight:600; }
  .dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot.team0{ background:var(--saffron); }
  .dot.team1{ background:var(--teal); }
  .reset-link{ background:rgba(77,13,10,.62); border:1px solid var(--line); color:var(--cream); border-radius:999px; padding:8px 13px; font-size:13px; font-weight:750; cursor:pointer; }
  .reset-link:hover{ color:var(--text-ink); border-color:var(--text-ink-dim); }
  .reset-link.danger{ color:#ffd9cf; border-color:rgba(255,116,91,.68); background:linear-gradient(180deg,rgba(117,25,17,.86),rgba(65,11,8,.9)); box-shadow:0 0 0 1px rgba(255,166,125,.08),0 7px 18px rgba(34,2,1,.32); }
  .reset-link.danger:hover{ color:#fff4ef; border-color:#ff9d84; }

  .screen{ flex:1; display:flex; flex-direction:column; gap:8px; }

  .btn{ border:none; border-radius:14px; padding:14px 20px; font-size:15px; font-weight:700; cursor:pointer; transition:transform .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:linear-gradient(180deg, var(--saffron), var(--saffron-dim)); color:#241705; box-shadow:0 10px 26px rgba(227,162,60,0.28); }
  .btn-block{ width:100%; }

  .card-panel{ background:linear-gradient(145deg,rgba(90,20,16,.83),rgba(42,7,6,.9)); border:1px solid var(--line); border-radius:24px; padding:17px; box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); }
  .lede{ color:var(--text-ink-dim); font-size:14px; line-height:1.9; margin-top:6px; }
  .seat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .seat-field{ display:flex; flex-direction:column; gap:5px; }
  .seat-field label{ font-size:12px; color:var(--cream-dim); font-weight:700; }
  .seat-field input{ background:rgba(39,5,4,.72); border:1px solid var(--line); border-radius:14px; padding:11px 12px; color:var(--text-ink); font-family:inherit; font-size:14px; }
  details.rules{ font-size:13px; }
  details.rules summary{ cursor:pointer; font-weight:700; color:var(--saffron); }

  .gate{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; padding:20px 10px; }
  .lantern{ width:88px; height:88px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:30px;
    background:radial-gradient(circle at 35% 30%, var(--saffron), var(--saffron-dim) 65%, transparent 70%);
    box-shadow:0 0 0 10px rgba(227,162,60,0.08), 0 0 50px rgba(227,162,60,0.35);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .lantern{ animation:none; } }
  @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  .gate .to-whom{ font-size:21px; font-weight:800; }
  .gate .instruction{ color:var(--text-ink-dim); font-size:14px; max-width:320px; }

  .identity-screen{ min-height:100dvh; display:grid; place-items:center; padding:22px 12px; }
  .identity-card{
    position:relative; width:min(92vw,520px); padding:34px 26px 30px; overflow:hidden; text-align:center;
    border-radius:42px; border:1px solid rgba(240,198,110,.5);
    background:linear-gradient(145deg,rgba(105,24,18,.9),rgba(38,6,5,.94));
    box-shadow:0 28px 70px rgba(17,1,0,.62),inset 0 1px 0 rgba(255,255,255,.1),0 0 42px rgba(220,154,53,.12);
  }
  .identity-card::before{ content:""; position:absolute; width:220px; height:220px; border-radius:50%; top:-150px; left:50%; translate:-50% 0; background:rgba(242,197,108,.17); filter:blur(10px); }
  .identity-prompt{ position:relative; margin:0 0 24px; color:#fffaf0; font-size:clamp(20px,5vw,27px); font-weight:900; text-shadow:0 3px 12px rgba(0,0,0,.75); }
  .identity-list{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .identity-credit{ position:relative; margin:22px 0 0; color:var(--saffron); font-size:13px; font-weight:800; letter-spacing:.15px; text-shadow:0 2px 10px rgba(0,0,0,.72); }
  .identity-name{
    min-height:66px; padding:11px 14px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(240,198,110,.54); color:#fffaf0; background:linear-gradient(145deg,rgba(124,31,23,.8),rgba(51,9,7,.92));
    font:900 clamp(18px,4.5vw,23px)/1.2 'Vazirmatn',Tahoma,sans-serif;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 20px rgba(15,1,0,.28); transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .identity-name:hover{ transform:translateY(-2px); border-color:#f4d58b; box-shadow:0 0 22px rgba(240,198,110,.22),0 10px 24px rgba(15,1,0,.34); }
  .identity-name:active{ transform:scale(.97); }

  .table-wrap{
    position:relative; width:min(100%, 620px); aspect-ratio:999/1577; margin:2px auto;
    overflow:hidden; isolation:isolate; border-radius:24px;
    background:#2a0d0d;
    box-shadow:0 24px 65px rgba(0,0,0,.62), 0 0 0 1px rgba(236,170,75,.22);
  }
  .table-board{
    position:absolute; inset:0; overflow:hidden; container-type:inline-size;
    background:#2a0d0d url('assets/hokm-table-mobile.webp') center/108% 108% no-repeat;
  }
  .table-wrap::after{ content:""; position:absolute; inset:0; z-index:8; pointer-events:none; box-shadow:inset 0 0 70px rgba(0,0,0,.55); }
  .table-surface{
    position:absolute; inset:18% 15% 17%; border-radius:48%; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse, transparent 50%, rgba(243,181,78,.06) 76%, transparent 78%);
  }
  .table-surface::after{ display:none; }
  .table-logo{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1;
    font-size:clamp(64px, 16vw, 122px); line-height:1;
    color:rgba(207,137,56,.32);
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.8)) drop-shadow(0 -1px 0 rgba(255,226,165,.13));
    pointer-events:none; user-select:none;
  }
  .table-logo svg{ display:block; width:1em; height:1em; }
  .seat{ position:absolute; display:block; width:240px; height:82px; z-index:9; pointer-events:none; }
  /* Names and won-trick numbers live on the carpet outside the table. */
  .seat.pos-top{ top:7%; left:50%; transform:translate(-50%,-50%); }
  .seat.pos-bottom{ bottom:7%; left:50%; transform:translate(-50%,50%); }
  .seat.pos-left{ left:6%; top:50%; transform:translate(-50%,-50%); }
  .seat.pos-right{ right:6%; top:50%; transform:translate(50%,-50%); }
  .seat .chip{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    color:var(--game-label-color); padding:3px 9px; font-size:var(--game-label-size); font-weight:950;
    display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap;
    border-radius:999px;
    text-shadow:0 1px 0 rgba(255,235,184,.52),0 -2px 1px #210803,0 3px 4px rgba(0,0,0,.95),0 0 8px rgba(199,112,32,.46);
    filter:sepia(.12); letter-spacing:-.02em;
  }
  .seat.pos-left .chip{ transform:translate(-50%,-50%) rotate(90deg); }
  .seat.pos-right .chip{ transform:translate(-50%,-50%) rotate(-90deg); }
  .table-crown{ display:inline-flex; width:clamp(32px,5.5vw,44px); color:var(--game-label-color); filter:drop-shadow(0 2px 2px #2c0c00) drop-shadow(0 0 6px rgba(242,197,108,.32)); }
  .seat.active .chip{ color:#ffe3a3; filter:drop-shadow(0 0 8px rgba(255,200,90,.9)); animation:turnGlow 1.35s ease-in-out infinite; }
  @keyframes turnGlow{ 50%{ filter:drop-shadow(0 0 14px rgba(255,210,110,1)); } }
  .won-cards{ display:inline-flex; align-items:center; min-width:12px; height:20px; gap:3px; flex:none; direction:ltr; padding:1px 2px; }
  .won-card{
    width:11px; height:17px; flex:none; border:1px solid rgba(255,226,155,.9); border-radius:2px;
    background:
      radial-gradient(circle,rgba(245,199,106,.34),transparent 42%),
      repeating-linear-gradient(45deg,rgba(255,223,152,.2) 0 1px,transparent 1px 4px),
      linear-gradient(145deg,#731811,#260504);
    box-shadow:0 2px 5px rgba(0,0,0,.65),inset 0 0 0 2px rgba(31,3,2,.55);
  }
  .seat.score-hit .won-card:last-child{ animation:scoreCatch 1.15s cubic-bezier(.2,.8,.2,1) 1.3s both; }
  @keyframes scoreCatch{
    0%{ transform:scale(1); box-shadow:0 2px 5px rgba(0,0,0,.65); }
    35%{ transform:scale(1.65) translateY(-3px); border-color:#fff0ae; box-shadow:0 0 9px #ffd574,0 0 23px rgba(242,197,108,.95); }
    100%{ transform:scale(1); }
  }
  .seat-chat{
    position:absolute; z-index:24; max-width:min(190px,46vw); padding:9px 13px; overflow:hidden;
    color:#4a100b; background:linear-gradient(145deg,#fffdf7,#f8e7bd); border:1px solid rgba(255,255,255,.92);
    border-radius:18px 18px 18px 5px; font-size:clamp(13px,2vw,16px); font-weight:800; line-height:1.45;
    white-space:normal; word-break:break-word; text-align:right; box-shadow:0 8px 24px rgba(25,2,1,.52),0 0 0 2px rgba(232,176,74,.26);
    animation:seatChatIn 6.5s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .seat-chat::after{ content:""; position:absolute; width:10px; height:10px; background:#f8e7bd; transform:rotate(45deg); }
  .seat.pos-top .seat-chat{ top:72%; left:50%; translate:-50% 0; }
  .seat.pos-top .seat-chat::after{ top:-5px; left:calc(50% - 5px); }
  .seat.pos-bottom .seat-chat{ bottom:72%; left:50%; translate:-50% 0; }
  .seat.pos-bottom .seat-chat::after{ bottom:-5px; left:calc(50% - 5px); }
  .seat.pos-left .seat-chat{ left:72%; top:50%; translate:0 -50%; }
  .seat.pos-left .seat-chat::after{ left:-5px; top:calc(50% - 5px); }
  .seat.pos-right .seat-chat{ right:72%; top:50%; translate:0 -50%; }
  .seat.pos-right .seat-chat::after{ right:-5px; top:calc(50% - 5px); }
  @keyframes seatChatIn{
    0%{ opacity:0; scale:.72; filter:blur(4px); }
    8%,78%{ opacity:1; scale:1; filter:blur(0); }
    100%{ opacity:0; scale:.92; }
  }
  .hakem-crown{ position:absolute; z-index:6; width:clamp(28px,6vw,48px); color:#ffc451; filter:drop-shadow(0 3px 3px #321200) drop-shadow(0 0 9px rgba(255,190,64,.8)); animation:crownFloat 2.1s ease-in-out infinite; }
  .hakem-crown.pos-top{ top:5.8%; left:50%; transform:translate(-50%,-50%); }
  .hakem-crown.pos-bottom{ bottom:5.8%; left:50%; transform:translate(-50%,50%) rotate(180deg); }
  .hakem-crown.pos-left{ left:4.6%; top:50%; transform:translate(-50%,-50%) rotate(90deg); }
  .hakem-crown.pos-right{ right:4.6%; top:50%; transform:translate(50%,-50%) rotate(-90deg); }
  @keyframes crownFloat{ 50%{ filter:drop-shadow(0 5px 4px #321200) drop-shadow(0 0 15px rgba(255,208,93,1)); } }
  .crown-flight{
    position:absolute; z-index:31; width:clamp(92px,20vw,180px); height:auto; color:#ffe27d; pointer-events:none;
    translate:-50% -50%; filter:drop-shadow(0 8px 6px #321200) drop-shadow(0 0 30px rgba(255,209,92,1));
    animation-duration:3.2s; animation-timing-function:cubic-bezier(.16,.78,.14,1); animation-fill-mode:both;
  }
  .crown-flight>svg{ display:block; animation:crownDropSpin .72s ease-in-out 4; }
  .crown-flight::before,.crown-flight::after{
    content:""; position:absolute; inset:-38%; border-radius:50%; border:4px solid rgba(255,232,151,.92);
    box-shadow:0 0 25px #fff0a9,0 0 65px rgba(255,190,48,.92),inset 0 0 26px rgba(255,222,120,.78);
    animation:crownDropRing 1.05s ease-out 3 both;
  }
  .crown-flight::after{ inset:-70%; border-width:2px; animation-delay:.12s; }
  .crown-flight .spark{
    position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:1px;
    background:#fff5bd; box-shadow:0 0 8px #fff,0 0 18px #ffb81f;
    transform:rotate(var(--spark-angle)) translateY(-28px) rotate(45deg);
    animation:crownDropSpark 1.1s ease-out var(--spark-delay) 3 both;
  }
  .crown-flight.pos-top{ animation-name:crownDropToTop; }
  .crown-flight.pos-bottom{ animation-name:crownDropToBottom; }
  .crown-flight.pos-left{ animation-name:crownDropToLeft; }
  .crown-flight.pos-right{ animation-name:crownDropToRight; }
  .seat.crown-arriving .table-crown{ animation:crownArrive .78s cubic-bezier(.18,.88,.22,1.35) both; animation-delay:var(--crown-arrive-delay,2.85s); }
  .seat.crown-celebrating .table-crown{ animation:crownChampion 1s cubic-bezier(.18,.88,.22,1.35) 3 both; }
  .crown-victory{
    position:absolute; z-index:29; width:clamp(58px,11vw,96px); color:#ffe079; pointer-events:none;
    translate:-50% -50%; filter:drop-shadow(0 3px 2px #4b1400) drop-shadow(0 0 18px #ffd15c);
    animation:crownVictoryMain 3.65s cubic-bezier(.2,.82,.18,1) both;
  }
  .crown-victory.pos-top{ left:50%; top:7%; }
  .crown-victory.pos-bottom{ left:50%; top:93%; }
  .crown-victory.pos-left{ left:6%; top:50%; }
  .crown-victory.pos-right{ left:94%; top:50%; }
  .crown-victory>svg{ display:block; animation:crownVictorySpin 1.05s ease-in-out 3; }
  .crown-victory::before,.crown-victory::after{
    content:""; position:absolute; inset:-38%; border:3px solid rgba(255,222,120,.88); border-radius:50%;
    box-shadow:0 0 15px #ffd574,0 0 38px rgba(255,189,61,.82),inset 0 0 20px rgba(255,230,148,.65);
    animation:crownVictoryRing 1.2s ease-out 3 both;
  }
  .crown-victory::after{ inset:-72%; border-width:2px; animation-delay:.14s; }
  .crown-victory .spark{
    position:absolute; left:50%; top:50%; width:7px; height:7px; margin:-3px; border-radius:1px;
    background:#fff1a8; box-shadow:0 0 7px #fff,0 0 14px #ffbf36;
    transform:rotate(var(--spark-angle)) translateY(-18px) rotate(45deg);
    animation:crownSpark 1.25s ease-out var(--spark-delay) 3 both;
  }
  @keyframes crownDropSpin{ 0%,100%{ transform:rotateY(0deg) rotateZ(-9deg); } 50%{ transform:rotateY(360deg) rotateZ(11deg) scale(1.1); } }
  @keyframes crownDropRing{ 0%{ opacity:0; scale:.18; rotate:0deg; } 24%{ opacity:1; } 100%{ opacity:0; scale:1.85; rotate:160deg; } }
  @keyframes crownDropSpark{ 0%{ opacity:0; transform:rotate(var(--spark-angle)) translateY(-18px) rotate(45deg) scale(.1); } 22%{ opacity:1; } 100%{ opacity:0; transform:rotate(var(--spark-angle)) translateY(-135px) rotate(225deg) scale(1.4); } }
  @keyframes crownArrive{ from{ opacity:0; scale:.15; filter:brightness(2.2) drop-shadow(0 0 22px #fff0a9); } 70%{ opacity:1; scale:1.35; } to{ opacity:1; scale:1; } }
  @keyframes crownChampion{ 0%,100%{ scale:1; filter:drop-shadow(0 0 6px #ffd574); } 45%{ scale:1.55; color:#fff2ad; filter:drop-shadow(0 0 22px #fff0a9); } }
  @keyframes crownVictoryMain{ 0%{ opacity:0; scale:.1; rotate:-35deg; } 14%{ opacity:1; scale:1.35; rotate:12deg; } 78%{ opacity:1; scale:1.1; } 100%{ opacity:0; scale:1.7; filter:brightness(1.8) drop-shadow(0 0 34px #fff0a9); } }
  @keyframes crownVictorySpin{ 0%,100%{ transform:rotateY(0deg) rotateZ(-7deg); } 50%{ transform:rotateY(360deg) rotateZ(9deg) scale(1.18); } }
  @keyframes crownVictoryRing{ 0%{ opacity:0; scale:.25; rotate:0deg; } 24%{ opacity:1; } 100%{ opacity:0; scale:1.75; rotate:150deg; } }
  @keyframes crownSpark{ 0%{ opacity:0; transform:rotate(var(--spark-angle)) translateY(-12px) rotate(45deg) scale(.1); } 22%{ opacity:1; } 100%{ opacity:0; transform:rotate(var(--spark-angle)) translateY(-92px) rotate(225deg) scale(1.3); } }
  @keyframes crownDropToTop{
    0%{ left:50%; top:-22%; opacity:0; scale:4.8; filter:blur(7px) brightness(2.2) drop-shadow(0 0 45px #fff2a6); }
    16%{ left:50%; top:18%; opacity:1; scale:3.5; filter:blur(0) brightness(1.7) drop-shadow(0 0 42px #ffd15c); }
    48%{ left:50%; top:48%; scale:2.15; } 74%{ left:50%; top:23%; scale:1.35; }
    90%{ left:50%; top:7%; opacity:1; scale:.78; filter:brightness(2.4) drop-shadow(0 0 50px #fff0a9); }
    100%{ left:50%; top:7%; opacity:0; scale:.38; }
  }
  @keyframes crownDropToBottom{
    0%{ left:50%; top:-22%; opacity:0; scale:4.8; filter:blur(7px) brightness(2.2) drop-shadow(0 0 45px #fff2a6); }
    16%{ left:50%; top:18%; opacity:1; scale:3.5; filter:blur(0) brightness(1.7) drop-shadow(0 0 42px #ffd15c); }
    48%{ left:50%; top:48%; scale:2.15; } 74%{ left:50%; top:73%; scale:1.35; }
    90%{ left:50%; top:93%; opacity:1; scale:.78; filter:brightness(2.4) drop-shadow(0 0 50px #fff0a9); }
    100%{ left:50%; top:93%; opacity:0; scale:.38; }
  }
  @keyframes crownDropToLeft{
    0%{ left:50%; top:-22%; opacity:0; scale:4.8; filter:blur(7px) brightness(2.2) drop-shadow(0 0 45px #fff2a6); }
    16%{ left:50%; top:18%; opacity:1; scale:3.5; filter:blur(0) brightness(1.7) drop-shadow(0 0 42px #ffd15c); }
    48%{ left:50%; top:48%; scale:2.15; } 74%{ left:24%; top:50%; scale:1.35; }
    90%{ left:6%; top:50%; opacity:1; scale:.78; filter:brightness(2.4) drop-shadow(0 0 50px #fff0a9); }
    100%{ left:6%; top:50%; opacity:0; scale:.38; }
  }
  @keyframes crownDropToRight{
    0%{ left:50%; top:-22%; opacity:0; scale:4.8; filter:blur(7px) brightness(2.2) drop-shadow(0 0 45px #fff2a6); }
    16%{ left:50%; top:18%; opacity:1; scale:3.5; filter:blur(0) brightness(1.7) drop-shadow(0 0 42px #ffd15c); }
    48%{ left:50%; top:48%; scale:2.15; } 74%{ left:76%; top:50%; scale:1.35; }
    90%{ left:94%; top:50%; opacity:1; scale:.78; filter:brightness(2.4) drop-shadow(0 0 50px #fff0a9); }
    100%{ left:94%; top:50%; opacity:0; scale:.38; }
  }
  .trick-slot{
    position:absolute; width:clamp(59px,12vw,93px); aspect-ratio:.714; z-index:3;
    --deal-x:0px; --deal-y:0px; --deal-rot:0deg; --target-rot:0deg;
    transform:translate(-50%,-50%) rotate(var(--target-rot));
  }
  .trick-slot::before{
    content:""; position:absolute; z-index:-1; left:8%; right:8%; bottom:-8%; height:28%; border-radius:50%;
    background:radial-gradient(ellipse,rgba(20,2,1,.62),rgba(20,2,1,.08) 62%,transparent 72%); filter:blur(5px);
    opacity:.34;
  }
  .trick-slot.latest-play{
    animation:cardDeal .48s cubic-bezier(.16,.78,.18,1) both;
  }
  .trick-slot.latest-play::before{
    animation:dealShadow .48s cubic-bezier(.16,.78,.18,1) both;
  }
  @keyframes cardDeal{
    from{ opacity:.18; transform:translate(calc(-50% + var(--deal-x)),calc(-50% + var(--deal-y))) rotate(var(--deal-rot)) scale(.68); filter:blur(1px) brightness(.8); }
    66%{ opacity:1; filter:blur(0) brightness(1.08); }
    86%{ transform:translate(-50%,-50%) rotate(var(--target-rot)) scale(1.055); }
    to{ opacity:1; transform:translate(-50%,-50%) rotate(var(--target-rot)) scale(1); filter:blur(0) brightness(1); }
  }
  @keyframes dealShadow{ from{ opacity:0; scale:2.2 .5; } 70%{ opacity:.72; scale:1.2 .8; } to{ opacity:.34; scale:1; } }
  .deal-deck,.deal-card{
    position:absolute; left:50%; top:50%; width:clamp(38px,8.4vw,62px); aspect-ratio:.714; pointer-events:none;
  }
  .deal-deck{ z-index:19; translate:-50% -50%; filter:drop-shadow(0 10px 13px rgba(0,0,0,.62)); }
  .deal-deck i,.deal-card i{
    position:absolute; inset:0; display:block; border-radius:8px; border:1px solid rgba(255,232,172,.9);
    background:
      radial-gradient(circle at 50% 50%,rgba(242,197,108,.24),transparent 28%),
      repeating-linear-gradient(45deg,rgba(255,220,145,.17) 0 2px,transparent 2px 7px),
      linear-gradient(145deg,#6d1712,#260605);
    box-shadow:0 8px 18px rgba(0,0,0,.48),inset 0 0 0 3px rgba(62,8,6,.88),inset 0 0 0 5px rgba(225,169,69,.54);
  }
  .deal-deck i:nth-child(1){ translate:-6px -5px; rotate:-4deg; }
  .deal-deck i:nth-child(2){ translate:-2px -3px; rotate:-1deg; }
  .deal-deck i:nth-child(3){ translate:3px 0; rotate:2deg; }
  .deal-card{
    z-index:20; --card-x:0vw; --card-y:0vh; --card-rot:0deg; --card-tilt:0deg;
    opacity:0; transform:translate(-50%,-50%); animation:singleCardDeal 1.24s cubic-bezier(.16,.76,.17,1) both;
  }
  .deal-card.pos-top{ --card-y:-38vh; --card-rot:180deg; }
  .deal-card.pos-bottom{ --card-y:38vh; }
  .deal-card.pos-left{ --card-x:-42vw; --card-rot:90deg; }
  .deal-card.pos-right{ --card-x:42vw; --card-rot:-90deg; }
  @keyframes singleCardDeal{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.86) rotate(var(--card-tilt)); filter:blur(1px) brightness(.82); }
    10%{ opacity:1; }
    74%{ opacity:1; filter:blur(0) brightness(1.12); }
    91%{ opacity:1; transform:translate(calc(-50% + var(--card-x)),calc(-50% + var(--card-y))) scale(.82) rotate(calc(var(--card-rot) + var(--card-tilt))); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--card-x)),calc(-50% + var(--card-y))) scale(.7) rotate(calc(var(--card-rot) + var(--card-tilt))); }
  }
  .play-gesture{
    position:absolute; z-index:2; width:clamp(62px,11vw,100px); height:clamp(24px,4vw,38px); border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse,rgba(10,1,0,.5),rgba(68,20,12,.22) 48%,transparent 74%); filter:blur(5px);
    animation:playerReach .58s cubic-bezier(.16,.78,.18,1) both;
  }
  .play-gesture.pos-top{ left:50%; top:25%; translate:-50% -50%; rotate:90deg; }
  .play-gesture.pos-bottom{ left:50%; top:75%; translate:-50% -50%; rotate:90deg; }
  .play-gesture.pos-left{ left:28%; top:50%; translate:-50% -50%; }
  .play-gesture.pos-right{ left:72%; top:50%; translate:-50% -50%; }
  @keyframes playerReach{ 0%{ opacity:0; scale:.35 .7; } 44%{ opacity:.72; scale:1.65 1; } 100%{ opacity:0; scale:.8 .7; } }
  .trick-slot.pos-bottom{ top:53%; left:50%; --deal-y:31vh; --deal-rot:3deg; }
  .trick-slot.pos-top{ top:47%; left:50%; --deal-y:-31vh; --deal-rot:-3deg; }
  .trick-slot.pos-right{ left:58.5%; top:50%; --deal-x:31vw; --deal-rot:-12deg; --target-rot:-4deg; }
  .trick-slot.pos-left{ left:41.5%; top:50%; --deal-x:-31vw; --deal-rot:12deg; --target-rot:4deg; }
  .trick-slot.collecting{ z-index:18; }
  .trick-slot.collecting .card{
    will-change:transform,opacity,filter;
    animation:collectCards 1.25s cubic-bezier(.22,.74,.18,1) calc(.56s + var(--collect-delay,0s)) forwards;
  }
  @keyframes collectCards{
    0%,12%{ transform:translate3d(0,0,0) scale(1) rotateZ(0); opacity:1; filter:brightness(1); }
    30%{ transform:translate3d(0,-2.4vh,30px) scale(1.08) rotateZ(-6deg); opacity:1; filter:brightness(1.2) drop-shadow(0 0 7px rgba(255,212,112,.65)); }
    100%{ transform:translate3d(var(--collect-x),var(--collect-y),0) scale(.13) rotateZ(540deg); opacity:.08; filter:brightness(1.35) drop-shadow(0 0 10px #f2c56c); }
  }
  .cut-effect{ position:absolute; z-index:22; width:clamp(105px,20vw,160px); aspect-ratio:1; pointer-events:none; translate:-50% -50%; }
  .cut-effect.pos-top{ left:50%; top:37%; }
  .cut-effect.pos-bottom{ left:50%; top:63%; }
  .cut-effect.pos-left{ left:40.5%; top:50%; }
  .cut-effect.pos-right{ left:59.5%; top:50%; }
  .cut-effect::before,.cut-effect::after{ content:""; position:absolute; inset:8%; border-radius:50%; border:3px solid rgba(255,213,116,.94); box-shadow:0 0 12px #ffd574,0 0 28px rgba(240,198,110,.75),inset 0 0 18px rgba(255,206,95,.44); animation:cutRing 1.45s cubic-bezier(.12,.7,.18,1) both; }
  .cut-effect::after{ inset:25%; border-width:2px; animation-delay:.1s; }
  .cut-symbol{ position:absolute; inset:0; display:grid; place-items:center; color:#ffe8a8; font-size:clamp(52px,11vw,86px); filter:drop-shadow(0 3px 0 #7d3515) drop-shadow(0 0 16px #ffc95f); animation:cutSymbol 1.45s cubic-bezier(.18,.8,.2,1) both; }
  .cut-spark{ position:absolute; left:50%; top:50%; width:145%; height:4px; translate:-50% -50%; background:linear-gradient(90deg,transparent,#fff5c8 23%,#e7a93e 50%,#fff5c8 77%,transparent); box-shadow:0 0 12px #ffd574; animation:cutSlash 1.45s ease-out both; }
  .cut-spark.second{ rotate:90deg; animation-delay:.08s; }
  @keyframes cutRing{ 0%{ opacity:0; scale:.2; } 24%{ opacity:1; } 100%{ opacity:0; scale:1.7; rotate:65deg; } }
  @keyframes cutSymbol{ 0%{ opacity:0; scale:.25; rotate:-35deg; } 25%{ opacity:1; scale:1.2; } 70%{ opacity:1; scale:1; rotate:8deg; } 100%{ opacity:0; scale:.82; } }
  @keyframes cutSlash{ 0%{ opacity:0; scale:.1 1; rotate:-28deg; } 20%{ opacity:1; scale:1; } 100%{ opacity:0; scale:1.2 .2; rotate:18deg; } }
  .center-badge{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:1; }

<script>
// ---------- static game data ----------

];
var RANKS = [
  { key:'2', label:'2', value:2 },{ key:'3', label:'3', value:3 },{ key:'4', label:'4', value:4 },
  { key:'5', label:'5', value:5 },{ key:'6', label:'6', value:6 },{ key:'7', label:'7', value:7 },
  { key:'8', label:'8', value:8 },{ key:'9', label:'9', value:9 },{ key:'10', label:'10', value:10 },
  { key:'J', label:'J', value:11, fa:'\u0633\u0631\u0628\u0627\u0632' },
  { key:'Q', label:'Q', value:12, fa:'\u0628\u06CC\u200C\u0628\u06CC' },

  { key:'A', label:'A', value:14, fa:'\u0622\u0633' }
];
var POS_ORDER = ['bottom','right','top','left']; // seat i sits at POS_ORDER[i]
var PLAYERS = [
  { seat:0, name:'داریوش' },
  { seat:1, name:'' },
  { seat:2, name:'' },

var FA_DIGITS = ['\u06F0','\u06F1','\u06F2','\u06F3','\u06F4'];
function toFaDigits(value){
  return String(value).replace(/\d/g,function(d){ return '\u06F0\u06F1\u06F2\u06F3\u06F4\u06F5\u06F6\u06F7\u06F8\u06F9'[Number(d)]; });

  var n = PLAYERS[seat] && PLAYERS[seat].name;

var TEAM_NAMES = { get: function(i){ return displayName(i===0?0:1) + ' \u0648 ' + displayName(i===0?2:3); } };
var IDENTITY_ORDER = [1,2,3,0]; // amir, saeed, milad, dariush (order requested)

  return POS_ORDER[(seat-viewer+4)%4];

function suitInfo(k){ for(var i=0;i<SUITS.length;i++) if(SUITS[i].key===k) return SUITS[i]; return null; }

var SUIT_PATHS = {
  H: '<path d="M12,21.2 C12,21.2 3,14.7 3,8.6 C3,5.4 5.5,3 8.6,3 C10.3,3 11.9,3.8 12,5.3 C12.1,3.8 13.7,3 15.4,3 C18.5,3 21,5.4 21,8.6 C21,14.7 12,21.2 12,21.2 Z"/>',

function rankInfo(k){ for(var i=0;i<RANKS.length;i++) if(RANKS[i].key===k) return RANKS[i]; return null; }
function teamOfSeat(seat){ return seat % 2; }

function createDeck(){
  var deck=[];
  for(var i=0;i<SUITS.length;i++) for(var j=0;j<RANKS.length;j++)
    deck.push({ suit:SUITS[i].key, rank:RANKS[j].key, value:RANKS[j].value });
  return deck;
}
function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sortHand(cards, trumpKey){
  var order = trumpKey ? [trumpKey].concat(SUITS.map(function(s){return s.key;}).filter(function(k){return k!==trumpKey;}))
                        : SUITS.map(function(s){return s.key;});
  return cards.slice().sort(function(a,b){
    var oa=order.indexOf(a.suit), ob=order.indexOf(b.suit);
    if(oa!==ob) return oa-ob;
    return a.value-b.value;
  });
}
function isPlayableLogic(card, hand, st){
  var lead = st.currentTrick.length ? st.currentTrick[0].card.suit : null;
  if(!lead) return true;
  var hasLead = hand.some(function(c){ return c.suit===lead; });
  if(!hasLead) return true;
  return card.suit===lead;
}

// ---------- persistent storage helpers ----------
var GAME_KEY = 'hokm_state_v1';
var PRESENCE_KEY = 'hokm_presence_v1';
var CHAT_KEY = 'hokm_chat_v1';
var NAMES_KEY = 'hokm_names_v1';

// This build talks to our own tiny server instead of Claude's artifact storage,
// so the whole game runs completely independently of Claude at runtime.
// Shared game data goes through the server's /api/kv REST API. The player's
// identity is intentionally kept in memory only, so every new visit asks again.
async function storageGet(key, shared){
  if(!shared){
    try{
      var v = localStorage.getItem('hokm_local_'+key);
      return (v!==null && v!==undefined) ? { key:key, value:v, shared:false } : null;
    }catch(e){ return null; }
  }
  try{
    var res = await fetch('/api/kv/'+encodeURIComponent(key));
    if(!res.ok) return null;
    var data = await res.json();
    return { key:key, value:data.value, shared:true };
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('hokm_local_'+key, value); return { key:key, value:value, shared:false }; }
    catch(e){ return null; }
  }
  try{
    var res = await fetch('/api/kv/'+encodeURIComponent(key), {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ value: value })
    });
    if(!res.ok) return null;
    return { key:key, value:value, shared:true };
  }catch(e){ console.error('storage set failed', key, e); return null; }
}
async function storageDelete(key, shared){
  if(!shared){
    try{ localStorage.removeItem('hokm_local_'+key); return { key:key, deleted:true, shared:false }; }
    catch(e){ return null; }
  }
  try{
    var res = await fetch('/api/kv/'+encodeURIComponent(key), { method:'DELETE' });
    if(!res.ok) return null;
    return { key:key, deleted:true, shared:true };
  }catch(e){ return null; }
}

// ---------- app state ----------
var myIdentity = null; // seat number 0..3, or null until chosen
var state = null;      // shared game state
var presence = {};     // { seat: lastSeenTimestamp }
var chatMessages = [];
var chatOpen = false;
var lastSeenChatCount = 0;
var pollFailed = false;
var autoAdvanceScheduled = {};
var dealAdvanceScheduled = {};

var adminLoginError = '';
var audioContext = null;
var audioMaster = null;
var lastAppMarkup = '';
var pollInFlight = false;
var pollCounter = 0;
var pollTimer = null;
var presenceTimer = null;
var stateWritesInFlight = 0;
var humanPlayInFlight = false;
var lastAnimatedActionSeq = 0;
var lastAnimatedTrickSeq = 0;
var lastAnimatedCutSeq = 0;
var lastScheduledDealAudioSeq = '';
var lastCrownTransferSeq = 0;

function defaultState(){
  return {
    league:[0,0],
    matchScore:[0,0],
    gameId:Date.now(),
    hakemIndex: Math.floor(Math.random()*4),
    nextHakemIndex:null,
    nextHakemConfirmedAtMatchEnd:false,
    phase:'lobby',
    trump:null,
    hands:[[],[],[],[]],
    remainingDeck:[],
    leader:null,
    turnIndex:null,
    currentTrick:[],
    tricksWon:[0,0],
    seatTricks:[0,0,0,0],
    round:1,
    lastTrickWinnerSeat:null,
    lastTrickCard:null,
    handResult:null,
    matchResult:null,
    matchEndedAt:null,
    dealStage:null,
    dealSeq:0,
    dealingStartedAt:null,
    crownTransfer:null,
    crownTransferSeq:0,
    trickSeq:0,
    actionSeq:0,
    cutEffect:null,
    botSeats:[false,false,false,false],
    updatedAt: Date.now()
  };
}

function normalizeState(st){
  if(!st || typeof st!=='object') return defaultState();
  if(!Array.isArray(st.league) || st.league.length!==2) st.league=[0,0];
  if(!Array.isArray(st.tricksWon) || st.tricksWon.length!==2) st.tricksWon=[0,0];
  if(!Array.isArray(st.seatTricks) || st.seatTricks.length!==4) st.seatTricks=[0,0,0,0];
  if(!Array.isArray(st.botSeats) || st.botSeats.length!==4) st.botSeats=[false,false,false,false];
  if(typeof st.gameId!=='number') st.gameId=typeof st.updatedAt==='number'?st.updatedAt:Date.now();
  if(typeof st.actionSeq!=='number') st.actionSeq=0;
  if(typeof st.dealSeq!=='number') st.dealSeq=0;
  if(typeof st.crownTransferSeq!=='number') st.crownTransferSeq=0;
  if(st.dealStage!=='initial' && st.dealStage!=='remainder') st.dealStage=null;
  if(typeof st.dealingStartedAt!=='number') st.dealingStartedAt=null;
  if(typeof st.matchEndedAt!=='number') st.matchEndedAt=null;
  if(st.nextHakemIndex!==null && (!Number.isInteger(st.nextHakemIndex) || st.nextHakemIndex<0 || st.nextHakemIndex>3)) st.nextHakemIndex=null;
  if(typeof st.nextHakemConfirmedAtMatchEnd!=='boolean') st.nextHakemConfirmedAtMatchEnd=false;
  if(!st.cutEffect || typeof st.cutEffect!=='object') st.cutEffect=null;
  if(!st.crownTransfer || typeof st.crownTransfer!=='object') st.crownTransfer=null;

function ensureAudio(){
  if(audioContext) return audioContext;
  try{
    audioContext = new (window.AudioContext||window.webkitAudioContext)();
    var compressor=audioContext.createDynamicsCompressor();
    compressor.threshold.value=-20;
    compressor.knee.value=10;
    compressor.ratio.value=12;
    compressor.attack.value=.003;
    compressor.release.value=.22;
    audioMaster=audioContext.createGain();
    audioMaster.gain.value=2.4;
    audioMaster.connect(compressor);
    compressor.connect(audioContext.destination);
  }catch(e){}
  return audioContext;
}
function playTone(freq, duration, volume, delay){
  var ctx=ensureAudio(); if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume();

async function pollTick(){
  if(pollInFlight || stateWritesInFlight>0 || myIdentity===null) return;
  pollInFlight = true;
  pollCounter++;
  try{
    var beforeAction = state ? (state.actionSeq||0) : 0;
    var beforePhase = state ? state.phase : null;
    var beforeCutSeq = state && state.cutEffect && state.cutEffect.seq ? state.cutEffect.seq : 0;
    var beforeCrownSeq = state ? (state.crownTransferSeq||0) : 0;
    var results = await Promise.all([
      storageGet(GAME_KEY,true),
      pollCounter%6===0 ? storageGet(NAMES_KEY,true) : Promise.resolve(null),
      pollCounter%2===0 ? storageGet(CHAT_KEY,true) : Promise.resolve(null),
      pollCounter%4===0 ? storageGet(PRESENCE_KEY,true) : Promise.resolve(null)
    ]);
    var res = results[0];
    if(res && res.value){
      try{
        var parsed = normalizeState(JSON.parse(res.value));
        var currentUpdatedAt = state && typeof state.updatedAt==='number' ? state.updatedAt : 0;
        var parsedUpdatedAt = typeof parsed.updatedAt==='number' ? parsed.updatedAt : 0;
        if(parsedUpdatedAt < currentUpdatedAt && !pollFailed) return;
        if((parsed.actionSeq||0)<beforeAction) lastAnimatedActionSeq = parsed.actionSeq||0;
        if((parsed.trickSeq||0)<(state && state.trickSeq||0)) lastAnimatedTrickSeq = parsed.trickSeq||0;
        state = parsed;
        pollFailed = false;
        if((parsed.actionSeq||0)>beforeAction) playCardSound();
        if(parsed.cutEffect && (parsed.cutEffect.seq||0)>beforeCutSeq) playCutSound();
        if(parsed.crownTransfer && (parsed.crownTransferSeq||0)>beforeCrownSeq && (parsed.crownTransferSeq||0)>lastCrownTransferSeq){
          lastCrownTransferSeq=parsed.crownTransferSeq||0;
          if(Date.now()-(parsed.crownTransfer.at||0)<3900){
            if(parsed.crownTransfer.mode==='stay') playCrownVictorySound(0);
            else playCrownTransferSound(0);
          }
        }
        if(parsed.phase==='matchEnd' && beforePhase!=='matchEnd') playVictorySound();
      }catch(e){ pollFailed = true; }
    } else if(!state){
      pollFailed = true;
    }
    if(results[1] && results[1].value){ try{ var arr=JSON.parse(results[1].value); if(Array.isArray(arr)&&arr.length===4){ for(var i=0;i<4;i++) if(arr[i]) PLAYERS[i].name=arr[i]; } }catch(e){} }
    if(results[2] && results[2].value){ try{ chatMessages=JSON.parse(results[2].value); }catch(e){} }
    if(results[3] && results[3].value){ try{ presence=JSON.parse(results[3].value); }catch(e){} }
    if(state && state.phase==='dealing'){
      scheduleDealAdvance(state.dealSeq,state.gameId);
      scheduleDealAudio(state);
    }
    if(state && state.phase==='trickResult') scheduleAutoAdvance(state.trickSeq);
    if(state && state.phase==='matchEnd') scheduleNextMatch(state.crownTransferSeq,state.gameId);
    maybeTriggerBot();
    // Only touch the DOM when something a person would actually notice has changed,
    // otherwise the periodic poll makes the screen flicker for no reason.
    var sig = computeSignature();
    if(sig !== lastSignature){ renderNow(); }
  } finally {
    pollInFlight = false;
  }
}

// ---------- persist helper ----------
async function persistState(ns){
  var baseUpdatedAt = state && typeof state.updatedAt==='number' ? state.updatedAt : null;
  ns.baseUpdatedAt = baseUpdatedAt;
  ns.updatedAt = Math.max(Date.now(), typeof baseUpdatedAt==='number' ? baseUpdatedAt+1 : 0);
  state = ns;
  renderNow();
  stateWritesInFlight++;
  var saved;
  try{
    saved = await storageSet(GAME_KEY, JSON.stringify(ns), true);
  } finally {
    stateWritesInFlight--;
  }
  if(!saved){
    pollFailed=true;
    setTimeout(pollTick, 60);
  }
}

function dealOrder(hakem){

async function dealNewHand(bumpRound){

async function applyTrumpChoice(suitKey){
  var ns = Object.assign({}, state);
  ns.trump = suitKey;
  var order = dealOrder(ns.hakemIndex);
  var deck = ns.remainingDeck.slice();
  var hands = ns.hands.map(function(h){ return h.slice(); });
  for(var round=0;round<2;round++){
    for(var k=0;k<4;k++) hands[order[k]] = hands[order[k]].concat(deck.splice(0,4));
  }
  for(var i=0;i<4;i++) hands[i] = sortHand(hands[i], ns.trump);
  ns.hands = hands;
  ns.remainingDeck = [];
  ns.leader = ns.hakemIndex;
  ns.turnIndex = ns.hakemIndex;
  ns.phase = 'dealing';
  ns.dealStage = 'remainder';
  ns.dealSeq = (state.dealSeq||0)+1;
  ns.dealingStartedAt = Date.now();
  await persistState(ns);
  scheduleDealAdvance(ns.dealSeq,ns.gameId);
  scheduleDealAudio(ns);
}

async function applyCardPlay(seat, cardIndex){
  var hands = state.hands.map(function(h){ return h.slice(); });
  var hand = hands[seat];
  var card = hand[cardIndex];
  if(!card || !isPlayableLogic(card, hand, state)) return;
  var leadSuit = state.currentTrick.length ? state.currentTrick[0].card.suit : null;
  var isTrumpCut = !!(leadSuit && leadSuit!==state.trump && card.suit===state.trump);
  hand.splice(cardIndex,1);
  var ns = Object.assign({}, state);
  ns.hands = hands;
  ns.currentTrick = state.currentTrick.concat([{ playerIndex: seat, card: card }]);
  ns.actionSeq = (state.actionSeq||0)+1;
  if(isTrumpCut){
    var previousCutSeq = state.cutEffect && state.cutEffect.seq ? state.cutEffect.seq : 0;
    ns.cutEffect = { seat:seat, seq:previousCutSeq+1, at:Date.now() };
    playCutSound();
  }
  playCardSound();

  if(ns.currentTrick.length < 4){
    ns.turnIndex = (seat+1)%4;
    ns.phase = 'playing';
    await persistState(ns);
    return;
  }

  var lead = ns.currentTrick[0].card.suit;
  var trumpPlays = ns.currentTrick.filter(function(t){ return t.card.suit===ns.trump; });
  var winnerEntry;
  if(trumpPlays.length){ winnerEntry = trumpPlays.reduce(function(a,b){ return b.card.value>a.card.value ? b : a; }); }
  else{
    var leadPlays = ns.currentTrick.filter(function(t){ return t.card.suit===lead; });
    winnerEntry = leadPlays.reduce(function(a,b){ return b.card.value>a.card.value ? b : a; });
  }
  var winSeat = winnerEntry.playerIndex;
  var team = teamOfSeat(winSeat);
  ns.tricksWon = ns.tricksWon.slice();
  ns.tricksWon[team]++;
  ns.seatTricks = (ns.seatTricks||[0,0,0,0]).slice();
  ns.seatTricks[winSeat]++;
  ns.lastTrickWinnerSeat = winSeat;
  ns.lastTrickCard = winnerEntry.card;
  ns.leader = winSeat;
  ns.trickSeq = (ns.trickSeq||0)+1;

  if(ns.tricksWon[team]>=7){
    ns.league = ns.league.slice();
    ns.league[team] += 1;
    ns.matchResult = { team:team, winnerSeat:winSeat };
    ns.matchEndedAt = Date.now();
    ns.turnIndex = null;
    ns.phase = 'matchEnd';
    if(teamOfSeat(ns.hakemIndex)!==team){
      var previousHakem=ns.hakemIndex;
      ns.hakemIndex=(ns.hakemIndex+1)%4;
      ns.crownTransferSeq=(state.crownTransferSeq||0)+1;
      ns.crownTransfer={from:previousHakem,to:ns.hakemIndex,mode:'move',seq:ns.crownTransferSeq,at:Date.now()};
    }else{
      ns.crownTransferSeq=(state.crownTransferSeq||0)+1;
      ns.crownTransfer={from:ns.hakemIndex,to:ns.hakemIndex,mode:'stay',seq:ns.crownTransferSeq,at:Date.now()};
    }
    await persistState(ns);
    if(ns.crownTransfer){
      lastCrownTransferSeq=ns.crownTransferSeq||0;
      if(ns.crownTransfer.mode==='stay') playCrownVictorySound(.08);
      else playCrownTransferSound(.08);
    }
    playVictorySound();
    scheduleNextMatch(ns.crownTransferSeq,ns.gameId);
  } else {
    ns.phase = 'trickResult';
    await persistState(ns);
    playTrickSound();
    scheduleAutoAdvance(ns.trickSeq);
  }
}

async function playCard(cardIndex){
  if(humanPlayInFlight) return;
  if(myIdentity !== state.turnIndex) return;
  if(state.botSeats && state.botSeats[myIdentity]) return;
  humanPlayInFlight = true;
  try{
    await applyCardPlay(state.turnIndex, cardIndex);
  } finally {
    humanPlayInFlight = false;
  }
}

// ---------- computer stand-in for an absent player ----------
// Simple, legal-move heuristics: not a strong strategist, just sensible and always legal,
// so a match can keep moving when someone has stepped away.
function botChooseTrumpSuit(hand){
  var counts = {};
  hand.forEach(function(c){ counts[c.suit] = (counts[c.suit]||0)+1; });
  var best = hand.length ? hand[0].suit : SUITS[0].key, bestCount = -1;
  SUITS.forEach(function(s){
    var c = counts[s.key]||0;
    if(c>bestCount){ bestCount=c; best=s.key; }
  });
  return best;
}
function botChooseCardIndex(hand, trickSoFar, trump){
  var legalIdx = [];
  hand.forEach(function(c,i){ if(isPlayableLogic(c, hand, {currentTrick:trickSoFar})) legalIdx.push(i); });
  if(!legalIdx.length) return -1;
  if(trickSoFar.length===0){
    legalIdx.sort(function(a,b){ return hand[b].value-hand[a].value; });
    return legalIdx[0];
  }
  var lead = trickSoFar[0].card.suit;
  var trumpPlays = trickSoFar.filter(function(t){ return t.card.suit===trump; });
  var currentBest = trumpPlays.length
    ? trumpPlays.reduce(function(a,b){ return b.card.value>a.card.value?b:a; }).card
    : trickSoFar.filter(function(t){ return t.card.suit===lead; }).reduce(function(a,b){ return b.card.value>a.card.value?b:a; }).card;
  function beats(card){
    if(card.suit===trump && currentBest.suit!==trump) return true;
    if(card.suit===trump && currentBest.suit===trump) return card.value>currentBest.value;
    if(card.suit!==trump && currentBest.suit===trump) return false;
    return card.suit===currentBest.suit && card.value>currentBest.value;
  }
  var winners = legalIdx.filter(function(i){ return beats(hand[i]); });
  if(winners.length){
    winners.sort(function(a,b){ return hand[a].value-hand[b].value; });
    return winners[0];
  }
  legalIdx.sort(function(a,b){ return hand[a].value-hand[b].value; });
  return legalIdx[0];
}
function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

function dealCardPlan(stage,hakem){
  var order=dealOrder(hakem), plan=[];
  if(stage==='initial'){
    for(var seatIndex=0;seatIndex<4;seatIndex++){
      for(var cardIndex=0;cardIndex<5;cardIndex++){
        plan.push({seat:order[seatIndex],delay:plan.length*.25});
      }
    }
  }else{
    for(var round=0;round<2;round++){
      for(var seatIndex2=0;seatIndex2<4;seatIndex2++){
        for(var cardIndex2=0;cardIndex2<4;cardIndex2++){
          var withinRound=seatIndex2*4+cardIndex2;
          plan.push({seat:order[seatIndex2],delay:(round===0?0:3.7)+withinRound*.19});
        }
      }
    }
  }
  return plan;
}
function playDealCardSound(){
  playTone(455,.042,.085,0);
}
function scheduleDealAudio(st){
  if(!st || st.phase!=='dealing') return;
  var key=st.gameId+':'+st.dealSeq+':'+st.dealStage;
  if(lastScheduledDealAudioSeq===key) return;
  lastScheduledDealAudioSeq=key;
  var elapsed=Math.max(0,Date.now()-(st.dealingStartedAt||Date.now()));
  dealCardPlan(st.dealStage,st.hakemIndex).forEach(function(card){
    var remaining=Math.round(card.delay*1000-elapsed);
    if(remaining>=-60) setTimeout(playDealCardSound,Math.max(0,remaining));
  });
}

var botActionInFlight = false;
async function maybeTriggerBot(){
  if(!state || botActionInFlight || !state.botSeats) return;
  if(state.phase==='trumpSelect' && state.botSeats[state.hakemIndex]){
    botActionInFlight = true;
    var seat = state.hakemIndex;
    var botGameId = state.gameId;
    await wait(500 + Math.random()*1200);
    if(state && state.gameId===botGameId && state.phase==='trumpSelect' && state.hakemIndex===seat && state.botSeats[seat]){
      await applyTrumpChoice(botChooseTrumpSuit(state.hands[seat]));
    }
    botActionInFlight = false;
  } else if(state.phase==='playing' && state.botSeats[state.turnIndex]){
    botActionInFlight = true;
    var seat2 = state.turnIndex;
    var trickLenBefore = state.currentTrick.length;
    var botGameId2 = state.gameId;
    await wait(500 + Math.random()*1200);
    if(state && state.gameId===botGameId2 && state.phase==='playing' && state.turnIndex===seat2 && state.currentTrick.length===trickLenBefore && state.botSeats[seat2]){
      var idx = botChooseCardIndex(state.hands[seat2], state.currentTrick, state.trump);
      if(idx>=0) await applyCardPlay(seat2, idx);
    }
    botActionInFlight = false;
  }
}

function scheduleDealAdvance(seq,gameId){
  if(!state || state.phase!=='dealing') return;
  var stage=state.dealStage;
  var timerKey=gameId+':'+seq+':'+stage;
  if(dealAdvanceScheduled[timerKey]) return;
  dealAdvanceScheduled[timerKey]=true;
  var duration=stage==='initial'?DEAL_INITIAL_MS:DEAL_REMAINDER_MS;
  var elapsed=Math.max(0,Date.now()-(state.dealingStartedAt||Date.now()));
  setTimeout(function(){ autoAdvanceDeal(seq,gameId,stage); },Math.max(20,duration-elapsed));
}
async function autoAdvanceDeal(seq,gameId,stage){
  if(!state || state.gameId!==gameId || state.phase!=='dealing' || state.dealSeq!==seq || state.dealStage!==stage) return;
  var ns=Object.assign({},state);
  ns.phase=stage==='initial'?'trumpSelect':'playing';
  ns.dealStage=null;
  ns.dealingStartedAt=null;
  await persistState(ns);
  maybeTriggerBot();
}

function scheduleNextMatch(crownSeq,gameId){
  if(!state || state.phase!=='matchEnd') return;
  var timerKey=gameId+':'+crownSeq;
  if(matchAdvanceScheduled[timerKey]) return;
  matchAdvanceScheduled[timerKey]=true;
  var endedAt=state.matchEndedAt||state.updatedAt||Date.now();
  var elapsed=Math.max(0,Date.now()-endedAt);
  setTimeout(function(){ autoStartNextMatch(crownSeq,gameId); },Math.max(30,MATCH_AUTO_START_MS-elapsed));
}
async function autoStartNextMatch(crownSeq,gameId){
  if(!state || state.gameId!==gameId || state.phase!=='matchEnd' || (state.crownTransferSeq||0)!==crownSeq) return;
  await dealNewHand(true);
}

function scheduleAutoAdvance(seq){
  var gameId = state && state.gameId;
  var timerKey = gameId+':'+seq;
  if(autoAdvanceScheduled[timerKey]) return;
  autoAdvanceScheduled[timerKey] = true;
  setTimeout(function(){ autoAdvanceTrick(seq,gameId); }, 2200);
}
async function autoAdvanceTrick(seq,gameId){
  if(!state || state.gameId!==gameId || state.phase!=='trickResult' || state.trickSeq!==seq) return;
  var ns = Object.assign({}, state);
  ns.currentTrick = [];

var TRICK_POINTS = {
  top:[50,38], bottom:[50,62], left:[41.5,50], right:[58.5,50]
};
var SCORE_POINTS = {
  top:[50,7], bottom:[50,93], left:[6,50], right:[94,50]
};

function collectVector(fromPos, toPos){
  var from = TRICK_POINTS[fromPos];
  var to = SCORE_POINTS[toPos];
  return {x:to[0]-from[0], y:to[1]-from[1]};
}

function latestSeatMessage(seat){
  var now=Date.now();
  for(var i=chatMessages.length-1;i>=0;i--){
    var msg=chatMessages[i];
    if(msg && msg.seat===seat && msg.ts && now-msg.ts<7000) return msg;
  }
  return null;
}

function seatMapHtml(opts){
  opts = opts || {};
  var collecting = (state.phase==='trickResult' || state.phase==='matchEnd') && state.lastTrickWinnerSeat!==null;
  var crownElapsed=state.crownTransfer&&state.crownTransfer.at?Math.max(0,Date.now()-state.crownTransfer.at):99999;
  var crownStay=!!(state.crownTransfer&&state.crownTransfer.mode==='stay');
  var crownTransferActive=!!(state.crownTransfer&&crownElapsed<(crownStay?3900:3700));
  var animateLatest = !!(opts.trick && opts.trick.length && (state.actionSeq||0)>lastAnimatedActionSeq);
  var animateCollection = collecting && (state.trickSeq||0)>lastAnimatedTrickSeq;
  var cutSeq = state.cutEffect && state.cutEffect.seq ? state.cutEffect.seq : 0;
  var animateCut = !!(state.cutEffect && state.cutEffect.at && Date.now()-state.cutEffect.at<1800 && cutSeq>lastAnimatedCutSeq);
  var collectTargetPos = collecting ? seatPosition(state.lastTrickWinnerSeat) : null;
  var html = '<div class="table-wrap"><div class="table-board"><div class="table-surface"></div>'+(state.phase==='matchEnd'?'<div class="victory-glow"></div>':'');
  for(var i=0;i<4;i++){
    var pos = seatPosition(i);
    var active = (opts.activeSeat===i);
    var isHakem = (state.hakemIndex===i);
    var crownArriving = crownTransferActive && !crownStay && state.crownTransfer.to===i;
    var crownCelebrating = crownTransferActive && crownStay && state.crownTransfer.to===i;
    var scoreHit = animateCollection && state.lastTrickWinnerSeat===i;
    var seatMessage = latestSeatMessage(i);
    var bubbleText = seatMessage ? String(seatMessage.text||'') : '';
    if(bubbleText.length>90) bubbleText=bubbleText.slice(0,90)+'\u2026';
    var crownSeatStyle=crownArriving?' style="--crown-arrive-delay:'+Math.max(-.78,2.85-crownElapsed/1000).toFixed(3)+'s"':'';
    html += '<div class="seat pos-'+pos+(active?' active':'')+(scoreHit?' score-hit':'')+(crownArriving?' crown-arriving':'')+(crownCelebrating?' crown-celebrating':'')+'"'+crownSeatStyle+'>'+
      '<div class="chip">'+(isHakem?'<span class="table-crown">'+crownIcon()+'</span>':'')+'<span class="seat-name">'+displayName(i)+'</span>'+trickCountHtml(i)+'</div>'+
      (seatMessage?'<div class="seat-chat">'+escapeHtml(bubbleText)+'</div>':'')+
    '</div>';
  }
  if(crownTransferActive){
    var crownFromPos=seatPosition(state.crownTransfer.from);
    if(crownStay){
      var sparks='';
      for(var spark=0;spark<12;spark++) sparks+='<i class="spark" style="--spark-angle:'+(spark*30)+'deg;--spark-delay:'+((spark%4)*.07)+'s"></i>';
      html += '<div class="crown-victory pos-'+crownFromPos+'" style="animation-delay:-'+(crownElapsed/1000).toFixed(3)+'s" aria-hidden="true">'+crownIcon()+sparks+'</div>';
    }else{
      var crownToPos=seatPosition(state.crownTransfer.to), flightSparks='';
      for(var flightSpark=0;flightSpark<16;flightSpark++) flightSparks+='<i class="spark" style="--spark-angle:'+(flightSpark*22.5)+'deg;--spark-delay:'+((flightSpark%4)*.06)+'s"></i>';
      html += '<div class="crown-flight pos-'+crownToPos+'" style="animation-delay:-'+(crownElapsed/1000).toFixed(3)+'s" aria-hidden="true">'+crownIcon()+flightSparks+'</div>';
    }
  }
  if(animateCut){
    var cutPos = seatPosition(state.cutEffect.seat);
    html += '<div class="cut-effect pos-'+cutPos+'" aria-hidden="true"><span class="cut-spark"></span><span class="cut-spark second"></span><span class="cut-symbol">'+suitIcon(state.trump)+'</span></div>';
  }
  if(animateLatest){
    var lastPlayedPos = seatPosition(opts.trick[opts.trick.length-1].playerIndex);
    html += '<div class="play-gesture pos-'+lastPlayedPos+'" aria-hidden="true"></div>';
  }
  if(opts.trick){
    for(var t=0;t<opts.trick.length;t++){
      var entry = opts.trick[t];
      var pos2 = seatPosition(entry.playerIndex);
      var vector = collecting ? collectVector(pos2, collectTargetPos) : null;
      var slotStyle = 'animation-delay:'+(t*.045)+'s';
      if(vector){
        slotStyle += ';--collect-x:'+vector.x+'vw;--collect-y:'+vector.y+'vh;--collect-delay:'+(t*.07)+'s';
      }
      var isLatest = animateLatest && t===opts.trick.length-1;
      html += '<div class="trick-slot pos-'+pos2+(isLatest?' latest-play':'')+(animateCollection?' collecting':'')+'" style="'+slotStyle+'">'+cardFace(entry.card, {mini:true, trump:entry.card.suit===state.trump})+'</div>';
    }
  }
  if(animateLatest) lastAnimatedActionSeq = state.actionSeq||0;
  if(animateCollection) lastAnimatedTrickSeq = state.trickSeq||0;
  if(animateCut) lastAnimatedCutSeq = cutSeq;
  if(opts.overlayHtml) html += opts.overlayHtml;
  if(opts.handHtml) html += '<div class="player-hand-overlay">'+opts.handHtml+'</div>';
  html += '</div></div>';
  return html;
}

  var elapsed=Math.max(0,Date.now()-(state.dealingStartedAt||Date.now()))/1000;
  var deck='<div class="deal-deck" aria-hidden="true"><i></i><i></i><i></i></div>';
  var cards=dealCardPlan(state.dealStage,state.hakemIndex).map(function(card,index){
    var delay=card.delay-elapsed;
    var tilt=((index%5)-2)*1.4;
    return '<div class="deal-card pos-'+seatPosition(card.seat)+'" style="animation-delay:'+delay.toFixed(3)+'s;--card-tilt:'+tilt+'deg" aria-hidden="true"><i></i></div>';
  }).join('');
  return deck+cards;
}

function renderDealingPhase(){
  return '<div class="screen game-screen">'+seatMapHtml({activeSeat:null,trick:[],overlayHtml:dealAnimationHtml()})+'</div>';
}

function renderTableHand(hand, isMyTurn, st){
  var middle=(hand.length-1)/2;
  var cards=hand.map(function(c,i){
    var playable=isMyTurn && isPlayableLogic(c,hand,st);
    var face=el(cardFace(c,{trump:c.suit===st.trump,extraClass:playable?'playable':'disabled'}));
    face.style.setProperty('--fan',((i-middle)*1.8)+'deg');
    face.style.setProperty('--lift',(Math.abs(i-middle)*1.15)+'px');
    if(playable) face.setAttribute('onclick','playCard('+i+')');
    return face.outerHTML;
  }).join('');
  return '<div class="table-hand">'+cards+'</div>';
}

function renderHandRows(hand, isMyTurn, st){
  var n = hand.length;
  var row1Count = n>7 ? Math.ceil(n/2) : n;
  var row1 = hand.slice(0, row1Count);
  var row2 = hand.slice(row1Count);
  function buildRow(cards, offset){
    return cards.map(function(c,i){
      var idx = offset+i;
      var playable = isMyTurn && isPlayableLogic(c, hand, st);
      var cls = playable ? 'playable' : 'disabled';
      var faceHtml = cardFace(c, { trump:c.suit===st.trump, extraClass:cls });
      var wrapped = el(faceHtml);
      return wrapped.outerHTML.replace('<div class="card', '<div onclick="'+(playable?('playCard('+idx+')'):'')+'" class="card');
    }).join('');
  }
  var rowsHtml = '<div class="hand-row">'+buildRow(row1,0)+'</div>';
  if(row2.length) rowsHtml += '<div class="hand-row">'+buildRow(row2, row1Count)+'</div>';
  return '<div class="hand-rows">'+rowsHtml+'</div>';
}

function renderPlayingPhase(){
  var myHand = state.hands[myIdentity] || [];
  var iAmBot = !!(state.botSeats && myIdentity!==null && state.botSeats[myIdentity]);
  var isMyTurn = (state.turnIndex === myIdentity) && !iAmBot;
  var handHtml = renderTableHand(myHand, isMyTurn, state);
  return '<div class="screen game-screen">'+
    seatMapHtml({activeSeat:state.turnIndex,trick:state.currentTrick,centerTrump:state.currentTrick.length===0,handHtml:handHtml})+
  '</div>';
}

function renderTrickResultPhase(){
  return '<div class="screen game-screen">'+seatMapHtml({activeSeat:state.lastTrickWinnerSeat,trick:state.currentTrick,centerTrump:false})+'</div>';
}

function renderHandEndPhase(){
  var advance = (myIdentity===0 && adminAuthenticated) ? '<button class="next-hand-fab" onclick="nextHandClick()" aria-label="دست بعد">↻</button>' : '';
  return '<div class="screen game-screen">'+seatMapHtml({activeSeat:null,trick:[],centerTrump:true,overlayHtml:advance})+'</div>';
}

function renderMatchEndPhase(){
  var mr = state.matchResult;
  return '<div class="screen game-screen">'+seatMapHtml({activeSeat:mr.winnerSeat,trick:state.currentTrick,centerTrump:false})+'</div>';
}

function chatFabIcon(){
  return '<svg class="fab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H10l-5 4v-4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>';
}
function settingsFabIcon(){
  return '<svg class="fab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.2"/><path d="M12 2v2.8M12 19.2V22M2 12h2.8M19.2 12H22M4.9 4.9l2 2M17.1 17.1l2 2M19.1 4.9l-2 2M6.9 17.1l-2 2"/></svg>';
}

function chatFabHtml(){
  if(myIdentity===null) return '';
  var unread = Math.max(0, chatMessages.length - lastSeenChatCount);
  return '<button class="chat-fab" onclick="toggleChat()" aria-label="پیام‌ها">'+chatFabIcon()+(unread>0 && !chatOpen ? '<span class="chat-badge">'+unread+'</span>' : '')+'</button>';
}
function chatPanelHtml(){
  if(!chatOpen) return '';
  var msgsHtml = chatMessages.length ? chatMessages.map(function(m){
    var mine = m.seat===myIdentity;
    var name = PLAYERS[m.seat] ? displayName(m.seat) : '?';
    return '<div class="chat-msg'+(mine?' mine':'')+'"><div class="chat-name">'+name+'</div><div class="chat-bubble">'+escapeHtml(m.text)+'</div></div>';
  }).join('') : '<div class="chat-empty">\u0647\u0646\u0648\u0632 \u067E\u06CC\u0627\u0645\u06CC \u0646\u06CC\u0633\u062A. \u0627\u0648\u0644\u06CC\u0646 \u0646\u0641\u0631 \u0628\u0627\u0634!</div>';
  return '<div class="chat-overlay">'+
    '<div class="chat-header"><span>\u0686\u062A</span><button class="reset-link" onclick="toggleChat()">\u0628\u0633\u062A\u0646</button></div>'+
    '<div class="chat-scroll" id="chatScroll">'+msgsHtml+'</div>'+
    '<div class="chat-input-row"><input id="chatInput" type="text" maxlength="300" placeholder="\u067E\u06CC\u0627\u0645..." onkeydown="if(event.key===\'Enter\'){sendChat();}"/><button class="btn btn-primary" onclick="sendChat()">\u0627\u0631\u0633\u0627\u0644</button></div>'+
  '</div>';
}

function adminFabHtml(){
  if(myIdentity!==0 || !adminAuthenticated) return '';
  return '<button class="chat-fab admin-fab" onclick="toggleAdmin()" aria-label="\u062A\u0646\u0638\u06CC\u0645\u0627\u062A \u0645\u062F\u06CC\u0631">'+settingsFabIcon()+'</button>';
}
function nextHakemPromptHtml(){
  if(myIdentity!==0 || !adminAuthenticated || !state || state.phase!=='matchEnd' || state.nextHakemConfirmedAtMatchEnd) return '';
  var names = PLAYERS.map(function(p,i){
    return '<button class="reset-link next-hakem-name" onclick="setNextHakem('+i+')">'+displayName(i)+'</button>';
  }).join('');
  return '<div class="next-hakem-modal" role="dialog" aria-modal="true" aria-labelledby="nextHakemTitle"><div class="next-hakem-dialog">'+
    '<h2 id="nextHakemTitle">\u062D\u0627\u06A9\u0645 \u062F\u0633\u062A \u0628\u0639\u062F</h2><p>\u06CC\u06A9 \u0628\u0627\u0632\u06CC\u06A9\u0646 \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0646</p><div class="next-hakem-names">'+names+'</div>'+
  '</div></div>';
}
function adminPanelHtml(){
  if(!adminOpen || myIdentity!==0 || !adminAuthenticated || !state) return '';
  var botRows = PLAYERS.map(function(p,i){
    var isBot = !!(state.botSeats && state.botSeats[i]);
    return '<div class="bot-row"><span>'+displayName(i)+'</span>'+
      '<button class="reset-link bot-toggle" onclick="toggleBot('+i+')" style="'+(isBot?'border-color:var(--saffron);color:var(--saffron);box-shadow:0 0 13px rgba(240,198,110,.18);':'')+'">'+
        (isBot ? '\u0631\u0628\u0627\u062A' : '\u0627\u0646\u0633\u0627\u0646')+
      '</button></div>';
  }).join('');
  var nameFields = PLAYERS.map(function(p,i){
    var label = '\u0628\u0627\u0632\u06CC\u06A9\u0646 ' + FA_DIGITS[i+1];
    return '<div class="seat-field"><label>'+label+'</label>'+
      '<input id="nameInput'+i+'" type="text" maxlength="14" placeholder="'+displayName(i)+'" value="'+escapeHtml(p.name)+'"/></div>';
  }).join('');
  var plannedHakem = Number.isInteger(state.nextHakemIndex) ? state.nextHakemIndex : null;
  var hakemButtons = PLAYERS.map(function(p,i){
    return '<button class="reset-link hakem-choice'+(plannedHakem===i?' selected':'')+'" onclick="setNextHakem('+i+')">'+displayName(i)+'</button>';
  }).join('');
  return '<div class="chat-overlay"><div class="settings-shell">'+
    '<div class="chat-header"><span>\u062A\u0646\u0638\u06CC\u0645\u0627\u062A</span><button class="reset-link" onclick="toggleAdmin()">\u0628\u0633\u062A\u0646</button></div>'+
    '<div class="chat-scroll settings-scroll">'+
      '<div class="card-panel settings-card">'+
        '<div class="settings-title"><h2>\u0628\u0627\u0632\u06CC\u06A9\u0646\u200C\u0647\u0627</h2><div class="settings-score"><b>'+toFaDigits(state.league[0])+'</b><b>'+toFaDigits(state.league[1])+'</b></div></div>'+
        '<div class="bot-list">'+botRows+'</div>'+
      '</div>'+
      '<div class="card-panel settings-card">'+
        '<div class="settings-title"><h2>\u062D\u0627\u06A9\u0645 \u062F\u0633\u062A \u0628\u0639\u062F</h2></div>'+
        '<div class="hakem-picker">'+hakemButtons+'</div>'+
        '<p class="hakem-note">'+(plannedHakem===null?'\u0627\u0646\u062A\u062E\u0627\u0628 \u0646\u0634\u062F\u0647':'\u0627\u0646\u062A\u062E\u0627\u0628: '+displayName(plannedHakem))+'</p>'+
      '</div>'+
      '<div class="card-panel settings-card">'+
        '<div class="settings-title"><h2>\u0646\u0627\u0645\u200C\u0647\u0627</h2></div>'+
        '<div class="seat-grid" style="margin-top:10px;">'+nameFields+'</div>'+
        '<button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="saveNames()">\u0630\u062E\u06CC\u0631\u0647</button>'+
      '</div>'+
      '<div class="card-panel settings-card settings-actions">'+
        '<button class="reset-link" onclick="changeIdentity()">\u062A\u063A\u06CC\u06CC\u0631 \u0628\u0627\u0632\u06CC\u06A9\u0646</button>'+
        '<button class="reset-link" onclick="resetLeagueConfirm()">\u0635\u0641\u0631 \u06A9\u0631\u062F\u0646 \u0627\u0645\u062A\u06CC\u0627\u0632</button>'+
        '<button class="reset-link danger" onclick="restartGameConfirm()">\u0634\u0631\u0648\u0639 \u062F\u0648\u0628\u0627\u0631\u0647 \u0628\u0627\u0632\u06CC</button>'+
      '</div>'+
    '</div></div></div>';
}

function render(){
  var app = document.getElementById('app');
  if(myIdentity===null){ document.body.classList.remove('table-mode'); var picker=renderIdentityPicker(); if(picker!==lastAppMarkup){ app.innerHTML=picker; lastAppMarkup=picker; } return; }
  if(!state){ document.body.classList.remove('table-mode'); var loading=renderLoading(); if(loading!==lastAppMarkup){ app.innerHTML=loading; lastAppMarkup=loading; } return; }
  document.body.classList.toggle('table-mode',['dealing','trumpSelect','playing','trickResult','handEnd','matchEnd'].indexOf(state.phase)!==-1);
  var body;
  switch(state.phase){
    case 'lobby': body = renderLobby(); break;
    case 'dealing': body = renderDealingPhase(); break;
    case 'trumpSelect': body = renderTrumpPhase(); break;
    case 'playing': body = renderPlayingPhase(); break;
    case 'trickResult': body = renderTrickResultPhase(); break;
    case 'handEnd': body = renderHandEndPhase(); break;
    case 'matchEnd': body = renderMatchEndPhase(); break;
    default: body = renderLobby();
  }
  var markup = topbarHtml() + body + chatFabHtml() + chatPanelHtml() + adminFabHtml() + adminPanelHtml();
  if(markup!==lastAppMarkup){ app.innerHTML=markup; lastAppMarkup=markup; }
  if(chatOpen) scrollChatToBottom();
}

init();
</script>
</body>
</html>
